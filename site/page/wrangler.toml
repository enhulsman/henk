# Henk's public page, https://henk.hulsman.dev (static assets only, no worker code).
# Update and deploy, from the repo root:
#   site/page/test-sync.sh && site/page/sync-from-build.sh
#   cd site/page && npx --yes wrangler@4.84.1 deploy
# public/ is generated by sync-from-build.sh; edit the build, not public/.
name = "henk-page"
compatibility_date = "2025-08-25"
routes = [{ pattern = "henk.hulsman.dev", custom_domain = true }]
# only the custom domain serves the page: no default Workers subdomain, no preview URLs
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
