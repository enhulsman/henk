# Henk stack: tailscale sidecar + agent + Signal bridge.
#
# Network topology (single default bridge network):
# - `tailscale` owns the network namespace and joins the tailnet as tag:henk.
# - `henk` shares tailscale's namespace (network_mode: service:tailscale): its
#   homelab egress leaves as tag:henk, its Anthropic egress leaves as ordinary
#   internet, and it reaches the Signal bridge by service name.
# - `signal-cli-rest-api` publishes NO ports, so it's unreachable from the host,
#   the LAN, and the tailnet — only the co-located containers can talk to it. It
#   still has outbound internet (required: it connects to Signal's servers).

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: henk
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY} # pre-authorized, tag:henk, ephemeral-off key
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false # kernel networking (needs /dev/net/tun + NET_ADMIN) so
        # containers sharing this namespace actually route over the tailnet
      - TS_EXTRA_ARGS=--advertise-tags=tag:henk
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    mem_limit: 128m

  henk:
    build: .
    depends_on:
      - tailscale
      - signal-cli-rest-api
    network_mode: service:tailscale
    env_file: .env # CLAUDE_CODE_OAUTH_TOKEN / NTFY_TOKEN / TODO_TOKEN / TS_AUTHKEY
    environment:
      - HENK_CONFIG=/app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    mem_limit: 512m

  signal-cli-rest-api:
    image: bbernhard/signal-cli-rest-api:latest
    environment:
      - MODE=json-rpc # persistent daemon + websocket receive (no polling)
    volumes:
      - signal-cli-config:/home/.local/share/signal-cli
    # No `ports:` — deliberately unpublished so the bridge stays private.
    restart: unless-stopped
    # PLACEHOLDER: size from the task 1.5 RSS probe (JVM ~300-500 MB observed).
    mem_limit: 600m

volumes:
  tailscale-state:
  signal-cli-config: # Signal account state — include in the rp5 backup routine
