# Henk configuration — non-secret settings only. Secrets come from the
# environment (.env, mode-600). See README / design D7.

owner:
  # Henk's owner identity as the channel reports it (Signal number or UUID).
  id: "+31600000000"

signal:
  # Compose-internal address of signal-cli-rest-api (no published ports).
  bridge_url: "http://signal-cli-rest-api:8080"
  account: "+31611111111" # Henk's dedicated Signal number
  safe_length: 2000

agent:
  model: "claude-sonnet-5"
  idle_timeout_seconds: 3600
  approval_timeout_seconds: 300

endpoints:
  gatus:
    base_url: "http://rp5:8080"
    timeout_seconds: 10
  prometheus:
    base_url: "http://vps:9090"
    timeout_seconds: 10
  # taiga_read is deferred to v1.1 (mixed personal/work data needs a scoped
  # Taiga account). This section is retained but NOT used by the v1 registry;
  # base_url will point at the Taiga REST API (not the MCP) when wired.
  taiga:
    base_url: "http://rp5:8000"
    timeout_seconds: 10
  todo:
    base_url: "http://vps:8089"
    timeout_seconds: 10
  ntfy:
    base_url: "http://vps:2586"
    topic: "homie-henk"
    # One-shot POST timeout for the notify tool. NOT the event-stream read
    # timeout — see events.liveness_deadline_seconds below.
    timeout_seconds: 10
    # The ntfy server's `keepalive-interval`, recorded here so the liveness
    # deadline can be validated against it. COUPLED to the server: if
    # keepalive-interval changes on the vps, change this value too — validation
    # compares Henk's deadline against this recorded copy, so a raised server
    # interval passes validation and then flaps the watchdog.
    keepalive_interval_seconds: 45

# Personal-data scoping (Tier-W boundary). Default-deny allowlists for tools whose
# backend mixes personal and work/Anamata content. EMPTY = fail closed: the tool
# surfaces NOTHING. This repo default stays empty on purpose — the real prefix lives
# only in the deployed rp5 config, so a forgotten value can never leak work data.
#
#   todo_read matches each todo's source note against these folder-boundary prefixes.
#   The owner-supplied value on rp5 is:
#     todo_note_allowlist: ["Personal/"]
#   (`Personal/` matches Personal/x.md and Personal/sub/y.md, but NOT Personal-work/…,
#   PersonalNotes/…, or a root Personal.md.)
#
# taiga_project_allowlist pre-shapes the deferred taiga_read fast-follow; nothing
# reads it yet (taiga_read stays unregistered until its project-id filter exists).
personal_data:
  todo_note_allowlist: []
  taiga_project_allowlist: []

# Event intake (henk-events v1.2). `enabled: false` is the rollback flag — the
# subscriber never starts and Henk behaves exactly as v1. Topics ride the single
# ntfy credential (NTFY_TOKEN: read on events, write on handoffs + notify).
# Cadence values are the design D6 defaults; tune from the first week's audit log.
events:
  enabled: true
  events_topic: "henk-events"
  handoffs_topic: "henk-handoffs"
  audit_path: "/data/audit/henk-audit.jsonl"
  debounce_seconds: 120
  cooldown_seconds: 21600 # 6h
  recurrence_window_seconds: 86400 # 24h
  cap_per_24h: 3
  cooldown_overrides:
    # Chronic identities carry a longer cooldown so they don't re-alert (D6.2).
    - pattern: "swap"
      cooldown_seconds: 86400 # 24h
  # Intake liveness watchdog. Without a read deadline a half-open socket produces
  # exactly the same observable as a healthy quiet tailnet — nothing — so any
  # conclusion drawn from an absence of events would rest on an assumption.
  # 135 = 3 x the recorded 45s server keepalive interval (three consecutive missed
  # keepalives), so a quiet homelab cannot trip it. Startup refuses a deadline
  # below that multiple.
  liveness_deadline_seconds: 135
  # How often the healthy-stream liveness line is logged. Hourly: a line per frame
  # would be ~1,920 a day. Each line carries the frame count since the previous
  # one, so the ~45s delivery cadence stays readable from the lines alone.
  liveness_report_interval_seconds: 3600
