[project]
name = "henk"
version = "0.1.0"
description = "Homie Henk — personal homelab agent on the Claude Agent SDK, reached over Signal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Deploy-time runtime dependency, pinned per task 1.4. Kept out of the default
# install and out of the test import path: agent-core is exercised with the SDK
# mocked (task 2.4), and the real wrapper imports this lazily.
runtime = [
    "claude-agent-sdk==0.2.123",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["henk"]
